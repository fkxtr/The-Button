[package]
name = "boton"
version = "0.1.0"
description = "One button. One random file. Absolute uncertainty."
authors = ["BOTÓN contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/fkxtr/The-Button"
default-run = "boton"

[lib]
name = "boton_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "boton"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
anyhow = "1"
fs2 = "0.4"
futures-util = "0.3"
infer = "0.19"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tauri = { version = "2", optional = true , features = [] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 8
