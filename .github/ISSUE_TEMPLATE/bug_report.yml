name: Bug report
description: Report unexpected application behavior.
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, follow SECURITY.md instead of posting exploit details here.
        Do not attach downloaded files, personal paths, credentials, or private information.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and the steps to reproduce it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and version
      placeholder: Linux Mint 22, x86_64
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant error or screenshot
      description: Remove personal information before sharing.
